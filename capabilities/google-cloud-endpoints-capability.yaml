      - name: pageSize
        type: integer
        description: pageSize
      - name: pageToken
        type: string
        description: pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: createservice
      description: Google Cloud Endpoints Create a managed service
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-cloud-endpoints.createservice
      outputParameters:
      - type: object
        mapping: $.
    - name: getservice
      description: Google Cloud Endpoints Get a managed service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-endpoints.getservice
      with:
        serviceName: tools.serviceName
      inputParameters:
      - name: serviceName
        type: string
        description: serviceName
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: deleteservice
      description: Google Cloud Endpoints Delete a managed service
      hints:
